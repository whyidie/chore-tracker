<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chore Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f5;
    padding: 2rem;
    min-height: 100vh;
    color: #222;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { margin-bottom: 1.5rem; font-size: 28px; }

  .add-form {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.6rem;
  }
  .add-form input[type="text"] {
    flex: 1;
    padding: 0.6rem 0.8rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
  }
  .add-form button {
    padding: 0.6rem 1.1rem;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
  }
  .add-form button[type="submit"] {
    background: #2d6cdf;
    color: white;
  }
  .add-form button[type="submit"]:hover { background: #2258bd; }
  .details-toggle {
    background: #e9e9e9;
    color: #333;
    width: 40px;
  }
  .details-toggle:hover { background: #dcdcdc; }

  .add-details {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }
  .add-details[hidden] { display: none; }
  .add-details input, .add-details textarea {
    flex: 1;
    padding: 0.5rem 0.7rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  .add-details textarea { min-height: 38px; }
  .add-details-checkbox {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 14px;
    color: #333;
    white-space: nowrap;
  }

  .filter-bar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
  }
  .filter-bar select {
    padding: 0.4rem 0.6rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    background: white;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }
  .column {
    background: white;
    border-radius: 8px;
    border: 1px solid #ddd;
    padding: 1.2rem;
    min-height: 300px;
  }
  .column h2 {
    font-size: 16px;
    margin-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #555;
  }
  .card {
    background: #fafafa;
    border: 1px solid #e2e2e2;
    border-radius: 6px;
    padding: 0.8rem;
    margin-bottom: 0.7rem;
  }
  .card-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem;
    margin-bottom: 0.4rem;
  }
  .card-title { font-size: 15px; word-break: break-word; }
  .owner-tag {
    font-size: 12px;
    color: #555;
    background: #eee;
    border-radius: 10px;
    padding: 0.15rem 0.55rem;
    white-space: nowrap;
  }
  .review-tag {
    font-size: 12px;
    color: #7a4d00;
    background: #ffe6b3;
    border-radius: 10px;
    padding: 0.15rem 0.55rem;
    white-space: nowrap;
  }
  .review-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .review-actions button {
    padding: 0.3rem 0.6rem;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    color: white;
    flex: 1;
  }
  .review-actions .approve-btn { background: #2f9e44; }
  .review-actions .approve-btn:hover { background: #268238; }
  .review-actions .reject-btn { background: #e04545; }
  .review-actions .reject-btn:hover { background: #c73838; }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
    flex-wrap: wrap;
  }
  .info-btn {
    border: none;
    background: #e9e9e9;
    color: #444;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 12px;
    line-height: 20px;
    text-align: center;
    cursor: pointer;
    padding: 0;
  }
  .info-btn:hover { background: #dcdcdc; }
  .description-box {
    font-size: 13px;
    color: #444;
    background: #f0f0f0;
    border-radius: 4px;
    padding: 0.5rem 0.6rem;
    margin-bottom: 0.5rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .completed-row {
    font-size: 12px;
    color: #666;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  .completed-row .edit-date-btn {
    border: none;
    background: none;
    color: #888;
    cursor: pointer;
    font-size: 12px;
    padding: 0;
  }
  .completed-row .edit-date-btn:hover { color: #333; }
  .completed-row input[type="datetime-local"] {
    font-size: 12px;
    padding: 0.15rem 0.3rem;
  }

  .card-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .card-actions select {
    flex: 1;
    padding: 0.3rem;
    border-radius: 4px;
    border: 1px solid #ccc;
    font-size: 13px;
  }
  .card-actions button {
    padding: 0.3rem 0.6rem;
    border: none;
    border-radius: 4px;
    background: #6b7280;
    color: white;
    font-size: 13px;
    cursor: pointer;
  }
  .card-actions button:hover { background: #565d68; }

  .edit-panel {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    margin-bottom: 0.5rem;
  }
  .edit-panel input, .edit-panel textarea {
    padding: 0.4rem 0.5rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
  }
  .edit-panel textarea { min-height: 50px; }
  .edit-panel-actions {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
  }
  .edit-panel-actions button {
    padding: 0.3rem 0.6rem;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    color: white;
  }
  .edit-panel-actions .save-btn { background: #2d6cdf; }
  .edit-panel-actions .save-btn:hover { background: #2258bd; }
  .edit-panel-actions .cancel-btn { background: #9ca3af; }
  .edit-panel-actions .cancel-btn:hover { background: #828a96; }
  .edit-panel-actions .delete-btn { background: #e04545; margin-left: auto; }
  .edit-panel-actions .delete-btn:hover { background: #c73838; }

  .empty { color: #999; font-size: 14px; }
  .error { color: #c73838; margin-bottom: 1rem; }
</style>
</head>
<body>
<div class="container">
  <h1>Chore Tracker</h1>
  <div id="error" class="error" hidden></div>
  <form class="add-form" id="addForm">
    <input type="text" id="newTitle" placeholder="Add a chore..." required>
    <button type="button" id="toggleDetails" class="details-toggle" title="Add owner / description">+</button>
    <button type="submit">Add</button>
  </form>
  <div class="add-details" id="addDetails" hidden>
    <input type="text" id="newOwner" placeholder="Owner (optional)">
    <textarea id="newDescription" placeholder="Description (optional)"></textarea>
    <label class="add-details-checkbox">
      <input type="checkbox" id="newNeedsReview">
      Requires review
    </label>
  </div>
  <div class="filter-bar">
    <select id="filterOwner">
      <option value="">All owners</option>
    </select>
    <select id="filterStatus">
      <option value="">All statuses</option>
    </select>
  </div>
  <div class="board">
    <div class="column">
      <h2>To Do</h2>
      <div class="column-items" id="col-todo"></div>
    </div>
    <div class="column">
      <h2>In Progress</h2>
      <div class="column-items" id="col-in-progress"></div>
    </div>
    <div class="column">
      <h2>Review</h2>
      <div class="column-items" id="col-review"></div>
    </div>
    <div class="column">
      <h2>Done</h2>
      <div class="column-items" id="col-done"></div>
    </div>
  </div>
</div>

<script>
const STATUSES = ['todo', 'in-progress', 'review', 'done'];
const STATUS_LABELS = { todo: 'To Do', 'in-progress': 'In Progress', review: 'Review', done: 'Done' };
const TIME_ZONE = 'America/Denver';
const errorEl = document.getElementById('error');
let allChores = [];

function allowedStatusesFor(chore) {
  if (chore.status === 'done') return ['todo', 'in-progress', 'done'];
  return chore.needs_review ? ['todo', 'in-progress', 'review'] : ['todo', 'in-progress', 'done'];
}

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.hidden = false;
}
function clearError() {
  errorEl.hidden = true;
}

function toMountainDisplayString(isoString) {
  return new Date(isoString).toLocaleString('en-US', {
    timeZone: TIME_ZONE,
    year: 'numeric', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
  });
}

function toMountainInputValue(isoString) {
  const fmt = new Intl.DateTimeFormat('en-US', {
    timeZone: TIME_ZONE, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });
  const parts = Object.fromEntries(fmt.formatToParts(new Date(isoString)).map(p => [p.type, p.value]));
  const hh = parts.hour === '24' ? '00' : parts.hour;
  return `${parts.year}-${parts.month}-${parts.day}T${hh}:${parts.minute}`;
}

function mountainInputValueToUTCISOString(localValue) {
  const [datePart, timePart] = localValue.split('T');
  const [y, mo, d] = datePart.split('-').map(Number);
  const [h, mi] = timePart.split(':').map(Number);
  const guess = Date.UTC(y, mo - 1, d, h, mi, 0);

  const fmt = new Intl.DateTimeFormat('en-US', {
    timeZone: TIME_ZONE, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
  const parts = Object.fromEntries(fmt.formatToParts(new Date(guess)).map(p => [p.type, p.value]));
  const hh = parts.hour === '24' ? 0 : parseInt(parts.hour, 10);
  const asIfUTC = Date.UTC(parts.year, parts.month - 1, parts.day, hh, parts.minute, parts.second);
  const offset = guess - asIfUTC;
  return new Date(guess + offset).toISOString();
}

async function loadChores() {
  clearError();
  try {
    const res = await fetch('/api/chores');
    if (!res.ok) throw new Error('Failed to load chores (' + res.status + ')');
    allChores = await res.json();
    populateOwnerFilter();
    applyFiltersAndRender();
  } catch (err) {
    showError(err.message);
  }
}

function populateOwnerFilter() {
  const select = document.getElementById('filterOwner');
  const current = select.value;
  const owners = Array.from(new Set(allChores.map(c => c.owner).filter(Boolean))).sort();
  select.innerHTML = '<option value="">All owners</option>' +
    owners.map(o => `<option value="${o}">${o}</option>`).join('');
  if (owners.includes(current)) select.value = current;
}

function applyFiltersAndRender() {
  const ownerFilter = document.getElementById('filterOwner').value;
  const statusFilter = document.getElementById('filterStatus').value;
  const filtered = allChores.filter(c => {
    if (ownerFilter && c.owner !== ownerFilter) return false;
    if (statusFilter && c.status !== statusFilter) return false;
    return true;
  });
  render(filtered);
}

function render(chores) {
  STATUSES.forEach(s => { document.getElementById('col-' + s).innerHTML = ''; });

  const byStatus = { todo: [], 'in-progress': [], review: [], done: [] };
  chores.forEach(c => {
    (byStatus[c.status] || byStatus.todo).push(c);
  });

  STATUSES.forEach(status => {
    const container = document.getElementById('col-' + status);
    const items = byStatus[status];
    if (items.length === 0) {
      container.innerHTML = '<p class="empty">Nothing here</p>';
      return;
    }
    items.forEach(chore => container.appendChild(renderCard(chore)));
  });
}

function renderCard(chore) {
  const card = document.createElement('div');
  card.className = 'card';

  function showView() {
    card.innerHTML = '';

    const top = document.createElement('div');
    top.className = 'card-top';
    const title = document.createElement('p');
    title.className = 'card-title';
    title.textContent = chore.title;
    top.appendChild(title);
    if (chore.owner) {
      const ownerTag = document.createElement('span');
      ownerTag.className = 'owner-tag';
      ownerTag.textContent = chore.owner;
      top.appendChild(ownerTag);
    }
    if (chore.needs_review) {
      const reviewTag = document.createElement('span');
      reviewTag.className = 'review-tag';
      reviewTag.textContent = 'Inspect';
      top.appendChild(reviewTag);
    }
    card.appendChild(top);

    if (chore.description) {
      const meta = document.createElement('div');
      meta.className = 'card-meta';
      const infoBtn = document.createElement('button');
      infoBtn.className = 'info-btn';
      infoBtn.textContent = 'i';
      infoBtn.title = 'View details';
      meta.appendChild(infoBtn);
      card.appendChild(meta);

      const descBox = document.createElement('div');
      descBox.className = 'description-box';
      descBox.textContent = chore.description;
      descBox.hidden = true;
      infoBtn.addEventListener('click', () => { descBox.hidden = !descBox.hidden; });
      card.appendChild(descBox);
    }

    if (chore.status === 'done' && chore.completed_at) {
      card.appendChild(renderCompletedRow(chore));
    }

    if (chore.needs_review && chore.status === 'review') {
      const reviewActions = document.createElement('div');
      reviewActions.className = 'review-actions';

      const approveBtn = document.createElement('button');
      approveBtn.className = 'approve-btn';
      approveBtn.textContent = 'Approve';
      approveBtn.addEventListener('click', () => updateChore(chore.id, { status: 'done' }));
      reviewActions.appendChild(approveBtn);

      const rejectBtn = document.createElement('button');
      rejectBtn.className = 'reject-btn';
      rejectBtn.textContent = 'Reject';
      rejectBtn.addEventListener('click', () => updateChore(chore.id, { status: 'in-progress' }));
      reviewActions.appendChild(rejectBtn);

      card.appendChild(reviewActions);
    }

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    if (!(chore.needs_review && chore.status === 'review')) {
      const select = document.createElement('select');
      allowedStatusesFor(chore).forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = STATUS_LABELS[s];
        if (s === chore.status) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener('change', () => updateChore(chore.id, { status: select.value }));
      actions.appendChild(select);
    }

    const editBtn = document.createElement('button');
    editBtn.textContent = 'Edit';
    editBtn.addEventListener('click', showEdit);
    actions.appendChild(editBtn);

    card.appendChild(actions);
  }

  function showEdit() {
    card.innerHTML = '';

    const panel = document.createElement('div');
    panel.className = 'edit-panel';

    const titleInput = document.createElement('input');
    titleInput.type = 'text';
    titleInput.value = chore.title;
    titleInput.placeholder = 'Title';
    panel.appendChild(titleInput);

    const ownerInput = document.createElement('input');
    ownerInput.type = 'text';
    ownerInput.value = chore.owner || '';
    ownerInput.placeholder = 'Owner (optional)';
    panel.appendChild(ownerInput);

    const descInput = document.createElement('textarea');
    descInput.value = chore.description || '';
    descInput.placeholder = 'Description (optional)';
    panel.appendChild(descInput);

    card.appendChild(panel);

    const editActions = document.createElement('div');
    editActions.className = 'edit-panel-actions';

    const saveBtn = document.createElement('button');
    saveBtn.className = 'save-btn';
    saveBtn.textContent = 'Save';
    saveBtn.addEventListener('click', () => {
      const title = titleInput.value.trim();
      if (!title) return;
      updateChore(chore.id, {
        title,
        owner: ownerInput.value.trim() || null,
        description: descInput.value.trim() || null
      });
    });
    editActions.appendChild(saveBtn);

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'cancel-btn';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', showView);
    editActions.appendChild(cancelBtn);

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'delete-btn';
    deleteBtn.textContent = 'Delete';
    deleteBtn.addEventListener('click', () => deleteChore(chore.id));
    editActions.appendChild(deleteBtn);

    card.appendChild(editActions);
  }

  showView();
  return card;
}

function renderCompletedRow(chore) {
  const row = document.createElement('div');
  row.className = 'completed-row';

  const label = document.createElement('span');
  label.textContent = 'Completed ' + toMountainDisplayString(chore.completed_at);
  row.appendChild(label);

  const editBtn = document.createElement('button');
  editBtn.className = 'edit-date-btn';
  editBtn.textContent = '✎';
  editBtn.title = 'Change completion date';
  row.appendChild(editBtn);

  editBtn.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'datetime-local';
    input.value = toMountainInputValue(chore.completed_at);
    row.replaceChildren(input);
    input.focus();

    const commit = () => {
      if (!input.value) return;
      const isoString = mountainInputValueToUTCISOString(input.value);
      updateChore(chore.id, { completed_at: isoString });
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') input.blur();
    });
  });

  return row;
}

async function updateChore(id, fields) {
  clearError();
  try {
    const res = await fetch('/api/chores/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(fields)
    });
    if (!res.ok) throw new Error('Failed to update chore (' + res.status + ')');
    await loadChores();
  } catch (err) {
    showError(err.message);
  }
}

async function deleteChore(id) {
  clearError();
  try {
    const res = await fetch('/api/chores/' + id, { method: 'DELETE' });
    if (!res.ok) throw new Error('Failed to delete chore (' + res.status + ')');
    await loadChores();
  } catch (err) {
    showError(err.message);
  }
}

document.getElementById('toggleDetails').addEventListener('click', () => {
  const details = document.getElementById('addDetails');
  details.hidden = !details.hidden;
});

const filterStatusEl = document.getElementById('filterStatus');
STATUSES.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s;
  opt.textContent = STATUS_LABELS[s];
  filterStatusEl.appendChild(opt);
});
document.getElementById('filterOwner').addEventListener('change', applyFiltersAndRender);
filterStatusEl.addEventListener('change', applyFiltersAndRender);

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();
  const titleInput = document.getElementById('newTitle');
  const ownerInput = document.getElementById('newOwner');
  const descInput = document.getElementById('newDescription');
  const needsReviewInput = document.getElementById('newNeedsReview');
  const title = titleInput.value.trim();
  if (!title) return;
  try {
    const res = await fetch('/api/chores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title,
        status: 'todo',
        owner: ownerInput.value.trim() || null,
        description: descInput.value.trim() || null,
        needs_review: needsReviewInput.checked
      })
    });
    if (!res.ok) throw new Error('Failed to add chore (' + res.status + ')');
    titleInput.value = '';
    ownerInput.value = '';
    descInput.value = '';
    needsReviewInput.checked = false;
    document.getElementById('addDetails').hidden = true;
    await loadChores();
  } catch (err) {
    showError(err.message);
  }
});

loadChores();
</script>
</body>
</html>
